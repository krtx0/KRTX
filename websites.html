<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="components/navbar.js" defer></script>
<script src="components/footer.js" defer></script>
<script src="style.css" defer></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        midnight: '#0f172a',
        charcoal: '#1e293b',
        gold: '#d4a017'
      }
    }
  }
}
</script>
<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }

/* 👇 ADD THIS */
.bottom-nav {
  transition: transform 0.3s ease;
  will-change: transform;
}

.bottom-nav.hide {
  transform: translateY(100%);
}
</style>

</head>

<body class="bg-midnight text-white h-screen overflow-hidden">

<!-- VIEWER -->
<main id="viewer" class="h-full overflow-y-auto pb-28 hide-scrollbar">
<custom-navbar></custom-navbar>
  <iframe
  id="showcaseFrame" 
  class="w-full h-full border-none "
></iframe>

</main>

<!-- BOTTOM NAV -->
<nav id="bottomNav" class="bottom-nav fixed bottom-0 left-0 right-0 bg-charcoal border-t border-white/10">

  <div class="max-w-4xl mx-auto px-4 py-3">

    <div class="flex items-center justify-between">

      <!-- LEFT -->
      <button id="prevBtn"
        class="text-gold text-4xl font-extrabold px-4 py-2">
        ←
      </button>

      <!-- CENTER TITLE -->
      <span id="showcaseTitle"
        class="text-sm font-medium tracking-wide uppercase text-center">
        —
      </span>

      <!-- RIGHT -->
      <button id="nextBtn"
        class="text-gold text-4xl font-extrabold px-4 py-2">
        →
      </button>

    </div>

  </div>
</nav>


<script src="js/websites.js?vs=0.0.1"></script>
</body>
</html>
