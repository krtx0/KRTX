<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="components/navbar.js" defer></script>
<script src="components/footer.js" defer></script>

<link rel="stylesheet" href="style.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        midnight: '#0f172a',
        charcoal: '#1e293b',
        gold: '#d4a017',
        cyberblue: '#00f0ff',
                        cyberpurple: '#bd00ff',
                        dark: '#0a0a0a',
                        darker: '#050505'
      }
    }
  }
}
</script>
<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }

/* 👇 ADD THIS */
.bottom-nav {
  transition: transform 0.3s ease;
  will-change: transform;
}

.bottom-nav.hide {
  transform: translateY(100%);
}
</style>

</head>

<body class="bg-midnight text-white h-screen overflow-hidden">

  <!-- Loading Overlay -->
<div id="loaderOverlay"
  class="pointer-events-none fixed  inset-0 bg-midnight/70 backdrop-blur-md flex items-center justify-center z-40 opacity-0 transition-opacity duration-300">
  <div class="flex flex-col items-center gap-4">
    <div class="w-12 h-12 border-4 border-gold border-t-transparent rounded-full animate-spin"></div>
    <span class="text-sm tracking-wide text-white/80 uppercase">Loading</span>
  </div>

</div>
<!-- VIEWER -->
<main id="viewer" class="relative h-full overflow-y-auto hide-scrollbar">
<custom-navbar></custom-navbar>
  <iframe
  id="showcaseFrame" 
  class="w-full h-full border-none "
></iframe>

</main>

<!-- FLOATING PILL NAV -->
<nav id="bottomNav"
  class="bottom-nav fixed bottom-6 left-1/2 -translate-x-1/2 z-50">

<div class="flex items-center gap-6
    bg-charcoal/60 backdrop-blur-xl
    border border-white/10
    rounded-full
    px-5 py-2.5
    shadow-2xl shadow-black/40">

    <!-- LEFT -->
<button id="prevBtn"
  class="w-10 h-10 rounded-full flex items-center justify-center
         bg-white/5 hover:bg-white/10
         border border-white/10
         transition-all duration-300
         hover:scale-110 active:scale-95">

  <svg xmlns="http://www.w3.org/2000/svg"
       class="w-4 h-4 text-cyberblue"
       fill="none"
       viewBox="0 0 24 24"
       stroke="currentColor"
       stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 18l-6-6 6-6"/>
  </svg>

</button>

    <!-- TITLE -->
    <span id="showcaseTitle"
      class="text-xs tracking-widest uppercase text-white/80 whitespace-nowrap">
      —
    </span>

    <!-- RIGHT -->
<button id="nextBtn"
  class="w-10 h-10 rounded-full flex items-center justify-center
         bg-white/5 hover:bg-white/10
         border border-white/10
         transition-all duration-300
         hover:scale-110 active:scale-95">

  <svg xmlns="http://www.w3.org/2000/svg"
       class="w-4 h-4 text-cyberblue"
       fill="none"
       viewBox="0 0 24 24"
       stroke="currentColor"
       stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 6l6 6-6 6"/>
  </svg>

</button>

  </div>

</nav>


<script src="js/websites.js"></script>
</body>
</html>
